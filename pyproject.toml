[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zav-sandbox"
version = "2.3.0"
description = "GSANE Framework Enhancement Project"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "types-PyYAML>=6.0",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0.1",
    "bandit>=1.7",
    "mutmut>=2.4",
]
mcp = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "_gsane/tools", "_gsane/mcp-server"]
addopts = "--strict-markers"
markers = [
    "unit: Test isolé sans dépendance externe (< 10ms, mocké si I/O)",
    "integration: Test avec vrais composants (MCP, fichiers, YAML, < 500ms)",
    "e2e: Test workflow complet de bout en bout (peut lancer bash, > 1s)",
    "compliance: Vérifie la structure des fichiers .md/.yaml GSANE",
    "behavioral: Tests comportementaux nécessitant bash/WSL",
    "benchmark: Mesure de performance vs baseline",
    "token_budget: Tests de régression sur le budget tokens des fichiers GSANE",
]

[tool.mutmut]
paths_to_mutate = "src/"
tests_dir = "tests/unit/"
runner = "python -m pytest tests/unit/ -x -q"

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["_gsane-output/", ".git/"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["S101", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"_gsane/tools/security_gate.py" = ["S603", "S607"]
"_gsane/mcp-server/compression_tool.py" = ["E402", "I001"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
warn_unused_ignores = true
disallow_untyped_defs = false
ignore_missing_imports = true
files = ["src/", "_gsane/mcp-server/", "_gsane/tools/"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "_gsane/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true
