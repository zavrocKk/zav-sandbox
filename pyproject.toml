[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "zav-sandbox"
version = "2.0.0"
description = "GSANE Framework Enhancement Project"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0.1",
    "mcp[cli]>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "bandit>=1.7",
    "pip-audit>=2.7",
]
test = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pyyaml>=6.0.1",
]
mcp = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "behavioral: Tests comportementaux (shell execution)",
    "mcp: Tests d'intégration MCP (smoke tests)",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
"_gsane/tools/security_gate.py" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = ["tests/*", "_gsane/*"]

[tool.coverage.report]
fail_under = 50
show_missing = true
