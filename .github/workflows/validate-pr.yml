name: Validate Pull Request

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Verify CHANGELOG.md exists
        run: |
          echo "🔍 Checking if CHANGELOG.md exists..."
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ ERROR: CHANGELOG.md not found!"
            echo "CHANGELOG.md is REQUIRED for all commits (Git Workflow Step 3.5)"
            exit 1
          fi
          echo "✅ CHANGELOG.md found!"

      - name: Validate CHANGELOG Format
        run: |
          echo "🔍 Validating CHANGELOG format..."
          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "❌ ERROR: CHANGELOG.md missing [Unreleased] section!"
            exit 1
          fi
          echo "✅ CHANGELOG format is valid!"

      - name: Check PR body is not empty
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "🔍 Checking PR description body..."
          if [[ -z "$PR_BODY" || "$PR_BODY" == "null" ]]; then
            echo "❌ ERROR: PR body is empty!"
            echo "Every PR MUST have a filled description (copilot-instructions.md — PR DESCRIPTION convention)."
            echo "Open the compare URL and fill the description field before submitting the PR."
            exit 1
          fi
          echo "✅ PR body is present (${#PR_BODY} characters)."

      - name: Validate agent manifest sync
        run: |
          echo "🔍 Checking _gsane/agents/*.md files present..."
          AGENT_MD_COUNT=$(find _gsane/agents -name "*.md" 2>/dev/null | wc -l)
          echo "  .md files found: $AGENT_MD_COUNT (expected: 5)"
          if [[ "$AGENT_MD_COUNT" -ne 5 ]]; then
            echo "❌ ERROR: Expected exactly 5 agent .md files in _gsane/agents, found $AGENT_MD_COUNT"
            exit 1
          fi
          echo "✅ Agent manifest check complete."

      - name: Validate GSANE Structure
        run: |
          echo "🔍 Checking GSANE directory structure..."
          required_dirs=(
            "_gsane" "_gsane/agents" "_gsane/workflows" 
            "_gsane/_config" "_gsane/_memory" ".github/agents" ".github/prompts" ".github/skills"
          )
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ ERROR: Required directory '$dir' missing!"
              exit 1
            fi
          done
          echo "✅ GSANE structure is valid!"

      - name: Validate branch naming
        run: |
          echo "🔍 Checking branch naming convention..."
          branch_name="${{ github.head_ref }}"
          if [[ ! "$branch_name" =~ ^(feature|fix)\/[a-z0-9\-]+\-[0-9]{4}\-[0-9]{2}\-[0-9]{2}$ ]]; then
            echo "⚠️  WARNING: Branch name '$branch_name' doesn't follow conventtion"
            echo "Expected format: feature/{description}-YYYY-MM-DD or fix/{description}-YYYY-MM-DD"
          fi
          echo "✅ Branch naming check complete!"

      - name: Validate workflow manifest integrity
        run: |
          pip3 install pyyaml --break-system-packages
          echo "🔍 Checking workflow manifest file integrity..."
          python3 - <<'EOF'
          import yaml, sys, os
          errors = 0
          with open('_gsane/_config/workflow-manifest.yaml', newline='', encoding='utf-8') as f:
              reader = yaml.safe_load(f)
              if reader:
                  for row in reader:
                      path = row.get('path', '').strip()
                      if not path:
                          continue
                      if not os.path.isfile(path):
                          print(f"❌ ERROR: workflow-manifest.yaml references missing file: {path}")
                          errors += 1
          if errors > 0:
              print(f"❌ {errors} missing workflow file(s) detected!")
              sys.exit(1)
          print("✅ All workflow manifest files exist!")
          EOF

      - name: Validate agent persona fields
        run: |
          echo "🔍 Checking agent manifest persona fields..."
          python3 - <<'EOF'
          import yaml, sys
          errors = 0
          with open('_gsane/_config/agent-manifest.yaml', newline='', encoding='utf-8') as f:
              reader = yaml.safe_load(f)
              if reader:
                  for row in reader:
                      name = row.get('name', '').strip()
                      cs = row.get('communicationStyle', '').strip()
                      pr = row.get('principles', '').strip()
                      if not cs:
                          print(f"❌ ERROR: Agent '{name}' has empty communicationStyle")
                          errors += 1
                      if not pr:
                          print(f"❌ ERROR: Agent '{name}' has empty principles")
                          errors += 1
          if errors > 0:
              print(f"❌ {errors} agent persona field(s) empty!")
              sys.exit(1)
          print("✅ All agent persona fields populated!")
          EOF

      - name: Validation Summary
        run: |
          echo ""
          echo "✅ ================ VALIDATION PASSED ================"
          echo "✅ CHANGELOG.md exists and is properly formatted"
          echo "✅ PR body is not empty"
          echo "✅ Agent .agent.md count verified"
          echo "✅ GSANE directory structure complete"
          echo "✅ Branch naming convention checked"
          echo "✅ Workflow manifest file integrity verified"
          echo "✅ Agent persona fields populated"
          echo "✅ All checks passed - Ready for merge!"
          echo "✅ ===================================================="


