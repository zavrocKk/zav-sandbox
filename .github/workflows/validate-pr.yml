name: Validate Pull Request

on:
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install validation dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest bandit pip-audit -r _gsane/mcp-server/requirements.txt

      - name: Verify CHANGELOG.md exists
        run: |
          echo "🔍 Checking if CHANGELOG.md exists..."
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ ERROR: CHANGELOG.md not found!"
            echo "CHANGELOG.md is REQUIRED for all commits (Git Workflow Step 3.5)"
            exit 1
          fi
          echo "✅ CHANGELOG.md found!"

      - name: Validate CHANGELOG Format
        run: |
          echo "🔍 Validating CHANGELOG format..."
          if ! grep -q "## \[Unreleased\]" CHANGELOG.md; then
            echo "❌ ERROR: CHANGELOG.md missing [Unreleased] section!"
            exit 1
          fi
          echo "✅ CHANGELOG format is valid!"

      - name: Check PR body is not empty
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          echo "🔍 Checking PR description body..."
          if [[ -z "$PR_BODY" || "$PR_BODY" == "null" ]]; then
            echo "❌ ERROR: PR body is empty!"
            echo "Every PR MUST have a filled description (copilot-instructions.md — PR DESCRIPTION convention)."
            echo "Open the compare URL and fill the description field before submitting the PR."
            exit 1
          fi
          echo "✅ PR body is present (${#PR_BODY} characters)."

      - name: Validate agent manifest sync
        run: |
          echo "🔍 Checking agent registry sync..."
          python3 - <<'EOF'
          import os
          import sys
          import yaml

          with open('_gsane/_config/agent-manifest.yaml', encoding='utf-8') as fh:
            manifest = yaml.safe_load(fh) or []

          manifest_paths = [entry.get('path', '').strip() for entry in manifest if entry.get('path')]
          agent_md_files = sorted(
            os.path.join('_gsane', 'agents', name)
            for name in os.listdir('_gsane/agents')
            if name.endswith('.md') and os.path.isfile(os.path.join('_gsane/agents', name))
          )

          errors = 0
          if len(agent_md_files) != len(manifest_paths):
            print(
              f"❌ ERROR: agent-manifest.yaml declares {len(manifest_paths)} agent path(s) but _gsane/agents contains {len(agent_md_files)} .md file(s)."
            )
            errors += 1

          missing_from_manifest = sorted(set(agent_md_files) - set(manifest_paths))
          missing_on_disk = sorted(path for path in manifest_paths if not os.path.isfile(path))

          for path in missing_from_manifest:
            print(f"❌ ERROR: Agent file not registered in manifest: {path}")
            errors += 1

          for path in missing_on_disk:
            print(f"❌ ERROR: Manifest references missing agent file: {path}")
            errors += 1

          if errors:
            sys.exit(1)

          print(f"✅ Agent manifest sync OK ({len(agent_md_files)} agent files / {len(manifest_paths)} manifest entries).")
          EOF

      - name: Validate GSANE Structure
        run: |
          echo "🔍 Checking GSANE directory structure..."
          required_dirs=(
            "_gsane" "_gsane/agents" "_gsane/workflows" 
            "_gsane/_config" "_gsane/_memory" ".github/agents" ".github/prompts" ".github/skills"
          )
          for dir in "${required_dirs[@]}"; do
            if [ ! -d "$dir" ]; then
              echo "❌ ERROR: Required directory '$dir' missing!"
              exit 1
            fi
          done
          echo "✅ GSANE structure is valid!"

      - name: Validate branch naming
        run: |
          echo "🔍 Checking branch naming convention..."
          branch_name="${{ github.head_ref }}"
          if [[ ! "$branch_name" =~ ^(feature|fix)\/[a-z0-9\-]+\-[0-9]{4}\-[0-9]{2}\-[0-9]{2}$ ]]; then
            echo "⚠️  WARNING: Branch name '$branch_name' doesn't follow conventtion"
            echo "Expected format: feature/{description}-YYYY-MM-DD or fix/{description}-YYYY-MM-DD"
          fi
          echo "✅ Branch naming check complete!"

      - name: Run repo quality gate
        run: bash gsane.sh validate

      - name: Vera — Security Gate
        run: |
          echo "🔒 Vera — Security Gate : prompt injection + CI permissions..."
          python _gsane/tools/security_gate.py vera-checks

      - name: Validate workflow manifest integrity
        run: |
          echo "🔍 Checking workflow manifest file integrity..."
          python3 - <<'EOF'
          import yaml, sys, os
          errors = 0
          with open('_gsane/_config/workflow-manifest.yaml', newline='', encoding='utf-8') as f:
              reader = yaml.safe_load(f)
              if reader:
                  for row in reader:
                      path = row.get('path', '').strip()
                      if not path:
                          continue
                      if not os.path.isfile(path):
                          print(f"❌ ERROR: workflow-manifest.yaml references missing file: {path}")
                          errors += 1
          if errors > 0:
              print(f"❌ {errors} missing workflow file(s) detected!")
              sys.exit(1)
          print("✅ All workflow manifest files exist!")
          EOF

      - name: Validate agent manifest registry fields
        run: |
          echo "🔍 Checking agent manifest registry fields..."
          python3 - <<'EOF'
          import yaml, sys
          errors = 0
          with open('_gsane/_config/agent-manifest.yaml', newline='', encoding='utf-8') as f:
              reader = yaml.safe_load(f)
              if reader:
                  for row in reader:
                      name = row.get('name', '').strip()
                      gr = str(row.get('golden_rule', '')).strip()
                      nd = row.get('never_do', [])
                      if not gr:
                          print(f"❌ ERROR: Agent '{name}' has empty golden_rule")
                          errors += 1
                      if not nd:
                          print(f"❌ ERROR: Agent '{name}' has empty never_do")
                          errors += 1
          if errors > 0:
              print(f"❌ {errors} agent registry field(s) empty!")
              sys.exit(1)
          print("✅ All agent registry fields populated!")
          EOF

      - name: Check agent version bump on agent file change
        run: |
          echo "🔍 Checking agent version bump consistency..."
          python3 - <<'EOF'
          import subprocess, sys
          result = subprocess.run(
              ["git", "diff", "--name-only", "origin/main...HEAD"],
              capture_output=True, text=True
          )
          changed = result.stdout.strip().splitlines()
          agent_md_changed = [f for f in changed if f.startswith("_gsane/agents/") and f.endswith(".md")]
          manifest_changed = "_gsane/_config/agent-manifest.yaml" in changed
          if agent_md_changed and not manifest_changed:
              print(f"❌ ERROR: Agent file(s) modified ({', '.join(agent_md_changed)}) but _gsane/_config/agent-manifest.yaml was NOT updated.")
              print("When modifying an agent .md file, you MUST bump its version in agent-manifest.yaml.")
              sys.exit(1)
          if agent_md_changed:
              print(f"✅ Agent files changed and manifest updated: {', '.join(agent_md_changed)}")
          else:
              print("✅ No agent .md files changed — skip version bump check.")
          EOF

      - name: Validation Summary
        run: |
          echo ""
          echo "✅ ================ VALIDATION PASSED ================"
          echo "✅ CHANGELOG.md exists and is properly formatted"
          echo "✅ PR body is not empty"
          echo "✅ Agent .agent.md count verified"
          echo "✅ Agent registry fields populated"
          echo "✅ GSANE directory structure complete"
          echo "✅ Branch naming convention checked"
          echo "✅ Repo quality gate passed (pytest non-behavioral + QA linter + guards)"
          echo "✅ Workflow manifest file integrity verified"
          echo "✅ Agent persona fields populated"
          echo "✅ All checks passed - Ready for merge!"
          echo "✅ ===================================================="


