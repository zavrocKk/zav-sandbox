name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Sync version to config.yaml
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Update version files
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          NEW_VERSION: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
        run: |
          sed -i "s/^version: .*/version: \"${NEW_VERSION}\"/" _gsane/config.yaml
          sed -i "s/.*/${NEW_VERSION}/" version.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _gsane/config.yaml version.txt
          git commit -m "chore(release): sync version to ${NEW_VERSION}"
          git push
