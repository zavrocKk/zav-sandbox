name: Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@16a9c90856f42705d54a6fda1823352bdc62cf38 # v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          release-type: simple
          package-name: gsane
          include-component-in-tag: false
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - name: Sync version to config.yaml
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          ref: ${{ github.ref }}

      - name: Update version files
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          NEW_VERSION: ${{ steps.release.outputs.major }}.${{ steps.release.outputs.minor }}.${{ steps.release.outputs.patch }}
        run: |
          sed -i "s/^version: .*/version: \"${NEW_VERSION}\"/" _gsane/config.yaml
          sed -i "s/.*/${NEW_VERSION}/" version.txt
          sed -i "s/^version = .*/version = \"${NEW_VERSION}\"/" pyproject.toml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _gsane/config.yaml version.txt pyproject.toml
          git commit -m "chore(release): sync version to ${NEW_VERSION}"
          git push
