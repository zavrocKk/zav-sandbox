name: Lint Markdown
on:
  pull_request:
    paths:
      - '**/*.md'

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint Markdown files
        uses: DavidAnson/markdownlint-cli2-action@v16
        with:
          globs: |
            README.md
            CONTRIBUTING.md
            SECURITY.md
            CODE_OF_CONDUCT.md
            ROADMAP.md
            VISION.md
            IDEAS.md
            .github/copilot-instructions.md
            .github/ISSUE_TEMPLATE/**/*.md
            .github/agents/**/*.md
            agents/**/*.md
            docs/incidents/**/*.md
            docs/architecture/**/*.md
            docs/decisions/**/*.md
            docs/runbooks/**/*.md
          config: '.markdownlint.json'

  naming-conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check docs/ naming conventions
        run: |
          set -e
          errors=0

          # docs/incidents/ and docs/architecture/ → YYYY-MM-DD-slug.md
          for dir in docs/incidents docs/architecture; do
            if [ -d "$dir" ]; then
              for f in "$dir"/*.md; do
                [ -f "$f" ] || continue
                name=$(basename "$f")
                [ "$name" = ".gitkeep" ] && continue
                if ! echo "$name" | grep -qE '^[0-9]{4}-[0-9]{2}-[0-9]{2}-[a-z0-9-]+\.md$'; then
                  echo "❌ Bad name in $dir: $name (expected YYYY-MM-DD-slug.md)"
                  errors=$((errors+1))
                fi
              done
            fi
          done

          # docs/decisions/ → NNNN-slug.md
          if [ -d "docs/decisions" ]; then
            for f in docs/decisions/*.md; do
              [ -f "$f" ] || continue
              name=$(basename "$f")
              [ "$name" = ".gitkeep" ] && continue
              if ! echo "$name" | grep -qE '^[0-9]{4}-[a-z0-9-]+\.md$'; then
                echo "❌ Bad name in docs/decisions: $name (expected NNNN-slug.md)"
                errors=$((errors+1))
              fi
            done
          fi

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "Fix naming conventions — see copilot-instructions.md (Table de localisation)."
            exit 1
          fi
          echo "✅ All naming conventions OK"

  check-relative-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relative markdown links validity
        run: |
          set -e

          # Extract "file<TAB>link" pairs with awk so the counter below runs in
          # the main shell (a pipe into `while` would lose the increment in a
          # subshell and the job could never fail). Skips fenced code blocks,
          # inline code spans and HTML comments: links there are examples.
          links_file="$(mktemp)"
          git ls-files '*.md' | xargs awk '
            FNR == 1 { fence = 0 }
            /^[[:space:]]*```/ { fence = !fence; next }
            fence { next }
            {
              line = $0
              gsub(/<!--.*-->/, "", line)
              gsub(/`[^`]*`/, "", line)
              while (match(line, /\]\(([^)#][^)]*)\)/)) {
                print FILENAME "\t" substr(line, RSTART + 2, RLENGTH - 3)
                line = substr(line, RSTART + RLENGTH)
              }
            }
          ' > "$links_file"

          errors=0
          while IFS="$(printf '\t')" read -r f link; do
            # Skip external URLs and template placeholders (<slug>, ...)
            case "$link" in
              http*|mailto*|*"<"*|...) continue;;
            esac

            # Resolve relative path
            path="${link%%#*}"  # Remove anchor
            [ -z "$path" ] && continue

            dir=$(dirname "$f")
            if [ "${path:0:1}" = "/" ]; then
              target=".${path}"
            else
              target="$dir/$path"
            fi

            # Check existence
            if [ ! -e "$target" ]; then
              echo "❌ Dead link in $f → $link (resolved to $target)"
              errors=$((errors+1))
            fi
          done < "$links_file"

          if [ "$errors" -gt 0 ]; then
            exit 1
          fi
          echo "✅ All relative links are valid"

  check-persona-subagent-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check persona ↔ subagent parity (excluding orchestrator)
        run: |
          set -e
          errors=0

          # Exclusions: orchestrator is special (no separate subagent for it)
          excluded="orchestrator"

          # List personas (agents/personas/*.md, basename without .md)
          personas=$(ls agents/personas/*.md 2>/dev/null | xargs -I {} basename {} .md | sort)

          for persona in $personas; do
            # Skip excluded
            if [ "$persona" = "$excluded" ]; then
              continue
            fi

            # Check if corresponding .github/agents/<persona>.agent.md exists
            if [ ! -f ".github/agents/${persona}.agent.md" ]; then
              echo "❌ Persona '$persona' has no matching subagent (.github/agents/${persona}.agent.md)"
              errors=$((errors+1))
            fi
          done

          # Check reverse: all subagents have a persona (excluding orchestrator.agent.md)
          subagents=$(ls .github/agents/*.agent.md 2>/dev/null | xargs -I {} basename {} .agent.md | sort)
          for agent in $subagents; do
            if [ "$agent" = "$excluded" ]; then
              continue
            fi

            if [ ! -f "agents/personas/${agent}.md" ]; then
              echo "❌ Subagent '${agent}.agent.md' has no matching persona (agents/personas/${agent}.md)"
              errors=$((errors+1))
            fi
          done

          if [ "$errors" -gt 0 ]; then
            echo ""
            echo "Fix parity between agents/personas/ and .github/agents/ (excluding orchestrator)."
            exit 1
          fi
          echo "✅ All personas have matching subagents"
