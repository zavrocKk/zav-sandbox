ide: github-copilot
configured_date: 2026-03-01T18:45:35.594Z
last_updated: 2026-04-09T00:00:00.000Z
configuration:
  instructions_file: ".github/copilot-instructions.md"
  agents_file: "AGENTS.md"

  # Copilot Chat — Agent activators
  # These activate specific GSANE agents via the agents dropdown or slash commands
  agents:
    - name: master
      description: "Gsane Master — orchestrator principal GSANE. Point d'entrée pour toutes les opérations."
      activation_file: "_gsane/agents/master.md"
    - name: bond
      description: "Bond — Expert en création et validation d'agents GSANE."
      activation_file: "_gsane/agents/bond.md"
    - name: architect
      description: "Winston — Architect: distributed systems, cloud infrastructure, API design, scalable patterns."
      activation_file: "_gsane/agents/architect.md"
    - name: dev
      description: "Amelia — Developer Agent: story execution, test-driven development, code implementation."
      activation_file: "_gsane/agents/dev.md"
    - name: qa
      description: "Quinn — QA Engineer: test automation, API testing, E2E testing, rapid coverage."
      activation_file: "_gsane/agents/qa.md"

  # Context files always injected into Copilot context window
  context_files:
    - path: "_gsane/config.yaml"
      reason: "Global config — user_name, communication_language, output_folder"
    - path: "_gsane/_config/agent-manifest.yaml"
      reason: "Agent index for JIT selection and routing"
    - path: "AGENTS.md"
      reason: "Universal repo navigation guide"

  # Token optimization hints for Copilot
  token_optimization:
    load_strategy: "jit"                 # Load files only when needed
    avoid_reloading_config: true         # Config resolved once per session
    party_mode_profile_loading: "selected-agent-files-only"  # Load only the manifest entries or agent files needed for the turn

  # Encoding of project conventions for Copilot inline suggestions
  conventions:
    language: "Français"
    branch_prefix: ["feature/", "fix/"]
    never_commit_to: "main"
    output_folder: "_gsane-output/"
    workflow_execution: "Load `.md` workflows directly; use YAML manifests as data, not via a workflow engine."

