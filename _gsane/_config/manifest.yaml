# manifest.yaml — Manifest global du framework GSANE
# Architecture : Flat Design — Strike Team 5 agents

name: "GSANE Framework"
version: "3.0.0"
architecture: "flat-design"
description: "Multi-agent governance framework for AI-native execution"

agents:
  count: 5
  manifest: "_gsane/_config/agent-manifest.yaml"

workflows:
  manifest: "_gsane/_config/workflow-manifest.yaml"

tasks:
  manifest: "_gsane/_config/task-manifest.yaml"

tools:
  manifest: "_gsane/_config/tool-manifest.yaml"

config:
  path: "_gsane/config.yaml"
  delegation_matrix: "_gsane/_config/delegation-matrix.yaml"

output:
  folder: "_gsane-output/"
  volatile:
    - "_gsane-output/current-delivery-contract.md"
    - "_gsane-output/delegation-audit.md"
    - "_gsane/_memory/trace.log"
    - "_gsane/_memory/sessions/session-state.md"
    - "_gsane/_memory/flywheel-report.md"
    - "_gsane/_memory/scoreboard.md"
  durable:
    - "_gsane/_memory/failure-museum.md"
    - "_gsane/_memory/decision-log.md"
    - "_gsane/_memory/flywheel-history.md"

deprecated:
  note: "The legacy CIS, TEA, and BMB module suites are fully retired as of v3.0.0. Only the 5-agent Strike Team remains active."

