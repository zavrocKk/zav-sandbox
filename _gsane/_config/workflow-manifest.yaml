- name: post-session-analysis
  description: "Automated post-session hook. Runs silently after every master session\
    \ or party mode exit. L\xE9o logs token patterns and optimization insights. Aria\
    \ logs compliance and regression signals. Appends to _gsane/_memory/session-analysis-log.md.\
    \ Counts sessions and fires FlywheelTrigger every N sessions (config: flywheel.trigger_every_n_sessions).\
    \ No user interaction required."
  module: core
  path: _gsane/workflows/post-session-analysis/workflow.md
  agent: master
  agent_display: Gsane Master
- name: flywheel-aggregate
  description: "Cognitive Flywheel \u2014 Aggregation cycle. Reads session-analysis-log.md,\
    \ extracts recurring patterns (\u22653 occurrences = confirmed), calculates flywheel-score\
    \ and trend, writes flywheel-report.md. Triggered automatically by post-session-analysis\
    \ every N sessions. Silent."
  module: core
  path: _gsane/workflows/flywheel/workflow-aggregate.md
  agent: optimizer
  agent_display: "L\xE9o"
- name: flywheel-apply
  description: "Cognitive Flywheel \u2014 Application cycle. Reads flywheel-report.md,\
    \ auto-applies low/medium corrections (max 5 per cycle), escalates high findings\
    \ to user. Creates fix/flywheel-{date} branch, commits, pushes PR, appends to\
    \ flywheel-history.md. Called by workflow-aggregate."
  module: core
  path: _gsane/workflows/flywheel/workflow-apply.md
  agent: optimizer
  agent_display: "L\xE9o"
- name: cc-verify
  description: "Completion Contract \u2014 20-point checklist to verify a task is\
    \ truly done before declaring it complete. Covers git, CHANGELOG, quality, manifests,\
    \ and CI. Run with [CC] or /gsane-cc-verify before any PR."
  module: core
  path: _gsane/workflows/cc-verify/workflow.md
  agent: master
  agent_display: Gsane Master
