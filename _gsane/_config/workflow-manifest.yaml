- name: post-session-analysis
  description: 'Automated post-session hook. Runs silently after every gsane-master
    session or party mode exit. Léo logs token patterns and optimization insights.
    Aria logs compliance and regression signals. Appends to _gsane/_memory/session-analysis-log.md.
    Counts sessions and fires FlywheelTrigger every N sessions (config: flywheel.trigger_every_n_sessions).
    No user interaction required.'
  module: core
  path: _gsane/core/workflows/post-session-analysis/workflow.md
  agent: gsane-master
  agent_display: Gsane Master
- name: flywheel-aggregate
  description: Cognitive Flywheel — Aggregation cycle. Reads session-analysis-log.md,
    extracts recurring patterns (≥3 occurrences = confirmed), calculates flywheel-score
    and trend, writes flywheel-report.md. Triggered automatically by post-session-analysis
    every N sessions. Silent.
  module: core
  path: _gsane/core/workflows/flywheel/workflow-aggregate.md
  agent: gsane-optimizer
  agent_display: Léo
- name: flywheel-apply
  description: Cognitive Flywheel — Application cycle. Reads flywheel-report.md, auto-applies
    low/medium corrections (max 5 per cycle), escalates high findings to user. Creates
    fix/flywheel-{date} branch, commits, pushes PR, appends to flywheel-history.md.
    Called by workflow-aggregate.
  module: core
  path: _gsane/core/workflows/flywheel/workflow-apply.md
  agent: gsane-optimizer
  agent_display: Léo
- name: brainstorming
  description: Facilitate interactive brainstorming sessions using diverse creative
