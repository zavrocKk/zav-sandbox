- name: delegation
  description: 'Core routing workflow. Analyzes every incoming request, matches keywords
    against the delegation matrix, and routes to the correct Strike Team agent via
    runSubagent. Triggers party-mode validation before any file write. Non-negotiable
    governance layer — all requests pass through this.'
  path: _gsane/workflows/delegation/workflow.md
  agent: master
  agent_display: Gsane Master

- name: cc-verify
  description: Completion Contract — 20-point checklist to verify a task is truly
    done before declaring it complete. Covers git, CHANGELOG, quality, manifests,
    and CI. Run with [CC] or /gsane-cc-verify before any PR.
  path: _gsane/workflows/cc-verify/workflow.md
  agent: master
  agent_display: Gsane Master

- name: validate-agent
  description: Agent compliance gate. Run after any GSANE agent/persona/manifest
    change. Verifies nested YAML under _gsane/_config, runs qa-linter on agents,
    executes the repo quality gate, then requires a Quinn verdict before delivery.
  path: _gsane/workflows/workflow-validate-agent.md
  agent: bond
  co_agent: qa
  agent_display: Bond + Quinn

- name: git-workflow
  description: 'Mandatory git protocol. Never commit to main. Always create a feature/*
    or fix/* branch, commit changes, push, then open a PR with a filled description.
    All agents must follow this workflow for any GSANE artifact change.'
  path: _gsane/workflows/git-workflow/workflow.md
  agent: master
  agent_display: Gsane Master

- name: post-session-analysis
  description: 'Automated post-session hook. Runs silently after every session.
    Logs token patterns and optimization insights into audit/continuity files.
    Appends to _gsane/_memory/sessions/session-analysis-log.md and can update
    session-state.md for continuity only. These files are not current project truth.
    Counts sessions and fires the Cognitive Flywheel every N sessions (config:
    flywheel.trigger_every_n_sessions). No user interaction required.'
  path: _gsane/workflows/post-session-analysis/workflow.md
  agent: master
  agent_display: Gsane Master

- name: flywheel
  description: 'Cognitive Flywheel — Boucle d''amélioration continue. Phase 1 agrège
    les patterns récurrents des sessions (>= 3 = confirmé), calcule flywheel-score. Phase 2
    auto-applique les corrections low/medium (max 5), escalade les HIGH. Déclenché par
    post-session-analysis tous les N sessions ou manuellement.'
  path: _gsane/workflows/flywheel/workflow.md
  agent: master
  co_agent: qa
  agent_display: Gsane Master + Quinn

- name: party-mode
  description: 'Collective validation protocol. Before any GSANE artifact modification,
    scores each agent by keyword match against the topic. Consensus requires >=2 APPROVE
    votes. BLOCK>=2 stops the action. Conflict (1 APPROVE + 1 BLOCK) escalates to Master.
    Audit trail written to _gsane-output/party-mode-audit.md. Zero exceptions for
    governance rules and schema changes.'
  path: _gsane/workflows/party-mode/workflow.md
  agent: master
  agent_display: Gsane Master

- name: post-feature-doc
  description: 'Vérifie la complétude documentaire post-feature. Déclenché par cc-verify après PASS. Non bloquant. Piloté par Langis, validé par Quinn.'
  path: _gsane/workflows/post-feature-doc/workflow.md
  agent: master
  co_agent: qa
  agent_display: Langis + Quinn

- name: ci-setup
  description: 'Setup CI/CD pipeline. Crée ci.yml, configure ruff/mypy/pytest-cov, Dependabot. Piloté par Winston, validé par Quinn.'
  path: _gsane/workflows/ci-setup/workflow.md
  agent: architect
  co_agent: qa
  agent_display: Winston + Quinn

- name: session-resume
  description: 'Reprise de session interrompue via MCP checkpoint. Détecte si le
    dernier checkpoint est marqué interrupted: true et propose le contexte de reprise.
    Activé via bash gsane.sh session --resume.'
  path: _gsane/workflows/session-resume/workflow.md
  agent: master
  agent_display: Gsane Master
