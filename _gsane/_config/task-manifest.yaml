# task-manifest.yaml — Tâches réutilisables de la Strike Team
# Ce fichier liste les tâches appelables comme sous-routines par les agents.
# DISTINCT du fichier de workflows UX accessibles à l'utilisateur.
# Les tâches ici ont un fichier .md dans _gsane/tasks/ ou .github/prompts/

# Tasks and tools are now exposed as prompts in .github/prompts/.
# Legacy XML task paths (core/tasks/) have been removed.

- name: editorial-review
  description: "Révision éditoriale d'un document GSANE : orthographe, cohérence, style."
  path: _gsane/tasks/editorial-review.md
  version: "1.0"
  owner: bond

- name: index-cleanup
  description: "Nettoyage et resynchronisation des manifests YAML avec le filesystem réel."
  path: _gsane/tasks/index-cleanup.md
  version: "1.0"
  owner: bond
