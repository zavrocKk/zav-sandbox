  output-location: report located with target document
  outputs: ''
- phase: anytime
  name: Adversarial Review (General)
  code: AR
  sequence: ''
  workflow-file: .github/prompts/gsane-review-adversarial-general.prompt.md
  command: gsane-review-adversarial-general
  required: false
  agent-name: ''
  agent-command: ''
  agent-display-name: ''
  agent-title: ''
  options: ''
  description: Review content critically to find issues and weaknesses. Use for quality
    assurance or before finalizing deliverables. Code Review in other modules run
    this automatically, but its useful also for document reviews
  output-location: ''
  outputs: ''
- phase: anytime
  name: Edge Case Hunter Review
  code: ECH
  sequence: ''
  workflow-file: .github/prompts/gsane-review-edge-case-hunter.prompt.md
  command: gsane-review-edge-case-hunter
  required: false
  agent-name: ''
  agent-command: ''
  agent-display-name: ''
  agent-title: ''
  options: ''
  description: Walk every branching path and boundary condition in code, report only
    unhandled edge cases. Use alongside adversarial review for orthogonal coverage
    - method-driven not attitude-driven.
  output-location: ''
  outputs: ''
- phase: anytime
  name: Completion Contract
  code: CC
  sequence: ''
  workflow-file: _gsane/workflows/cc-verify/workflow.md
  command: gsane-cc-verify
  required: false
  agent-name: master
  agent-command: gsane:Direct and comprehensive:agent:master
  agent-display-name: Gsane Master
  agent-title: 🧙 Gsane Master Executor
  options: Validate Mode
  description: Run the 20-point Completion Contract before declaring any task done.
    Checks git, CHANGELOG, quality, manifests, and CI.
  output-location: _gsane-output/
  outputs: CC PASS/FAIL report
- phase: anytime
  name: Session Branch
  code: SB
  sequence: ''
  workflow-file: _gsane/workflows/git-workflow/workflow.md
  command: gsane-git-workflow
  required: false
  agent-name: master
  agent-command: gsane:Direct and comprehensive:agent:master
  agent-display-name: Gsane Master
  agent-title: 🧙 Gsane Master Executor
  options: Validate Mode
  description: Verify or create the correct feature/fix branch before starting work.
    Uses the mandatory git workflow (never commit to main).
  output-location: _gsane-output/
  outputs: branch name
