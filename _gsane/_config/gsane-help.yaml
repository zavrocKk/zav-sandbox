  code: ES
  sequence: ''
  workflow-file: .github/prompts/gsane-editorial-review-structure.prompt.md
  command: gsane-editorial-review-structure
  required: false
  agent-name: ''
  agent-command: ''
  agent-display-name: ''
  agent-title: ''
  options: ''
