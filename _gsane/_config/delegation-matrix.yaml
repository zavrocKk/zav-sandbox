rules:
- trigger:
  - architecture
  - design
  - scalable
  - cloud
  - api
  agent: Winston (Architect)
  action: runSubagent
  description: System design, cloud infrastructure, API decisions.
- trigger:
  - code
  - implement
  - story
  - test-driven
  - dev
  agent: Amelia (Dev)
  action: runSubagent
  description: Code implementation governed by Delivery Contracts.
- trigger:
  - test
  - qa
  - validate
  - coverage
  - automate
  agent: Quinn (QA)
  action: runSubagent
  description: Test generation and execution, pipeline validation.
- trigger:
  - agent
  - persona
  - prompt
  - builder
  agent: Bond (Agent Builder)
  action: runSubagent
  description: GSANE agent construction and compliance validation.
- trigger:
  - orchestrate
  - master
  - plan
  - delivery contract
  agent: Langis (Master)
  action: runSubagent
  description: Create Delivery Contracts, coordinate strike team, manage workflow.
