# Delegation Matrix - Zero-Touch Strike Team & Extended Specialists
rules:
  # Strike Team
  - trigger: ["architecture", "design", "scalable", "cloud", "api"]
    agent: "Winston (Architect)"
    action: "runSubagent"
    description: "System design, cloud infrastructure, API decisions."
  - trigger: ["code", "implement", "story", "test-driven", "dev"]
    agent: "Amelia (Dev)"
    action: "runSubagent"
    description: "Code implementation governed by Delivery Contracts."
  - trigger: ["test", "qa", "validate", "coverage", "automate"]
    agent: "Quinn (QA)"
    action: "runSubagent"
    description: "Test generation and execution, pipeline validation."
  - trigger: ["agent", "persona", "prompt", "builder"]
    agent: "Bond (Agent Builder)"
    action: "runSubagent"
    description: "GSANE agent construction and compliance validation."
  - trigger: ["orchestrate", "master", "plan", "delivery contract"]
    agent: "Langis (Master)"
    action: "runSubagent"
    description: "Create Delivery Contracts, coordinate strike team, manage workflow."
    
  # Extended Specialists
  - trigger: ["test architect", "atdd", "ci/cd", "murat"]
    agent: "Murat (TEA)"
    action: "runSubagent"
    description: "Master test architecture, TDD strategies."
  - trigger: ["workflow", "wendy", "building workflow"]
    agent: "Wendy (Workflow Master)"
    action: "runSubagent"
    description: "Create/edit GSANE workflows."
  - trigger: ["module", "morgan", "module creation"]
    agent: "Morgan (Module Master)"
    action: "runSubagent"
    description: "Create/edit GSANE modules."
  - trigger: ["optimize", "léo", "token", "framework improvement"]
    agent: "Léo (Optimizer)"
    action: "runSubagent"
    description: "GSANE token optimization, session metrics."
  - trigger: ["brainstorm", "carson", "ideation", "creative"]
    agent: "Carson (Brainstorming Coach)"
    action: "runSubagent"
    description: "Elite brainstorming and ideation."
  - trigger: ["design thinking", "maya", "prototyping"]
    agent: "Maya (Design Thinking Maestro)"
    action: "runSubagent"
    description: "Design thinking, prototyping."
  - trigger: ["innovation", "victor", "disruptive"]
    agent: "Victor (Innovation Oracle)"
    action: "runSubagent"
    description: "Innovation strategy."
  - trigger: ["compliance", "aria", "qa gsane", "validation"]
    agent: "Aria (GSANE QA)"
    action: "runSubagent"
    description: "GSANE governance compliance."
  - trigger: ["storytelling", "sophia", "narrative", "brand stories"]
    agent: "Sophia (Storyteller)"
    action: "runSubagent"
    description: "Craft narratives and stories."
  - trigger: ["problem", "quinn", "triz", "root cause"]
    agent: "Dr. Quinn (Problem Solver)"
    action: "runSubagent"
    description: "Systematic problem solving."
  - trigger: ["presentation", "pitch", "visual", "caravaggio"]
    agent: "Caravaggio (Presentation Master)"
    action: "runSubagent"
    description: "Presentations, visual storytelling."
