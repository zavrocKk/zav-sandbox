project_name: "zav-sandbox — GSANE Framework Enhancement Project"
version: "2.3.0"
user_name: Mon Seigneur
communication_language: "Français"
document_output_language: "Français"
user_skill_level: expert
user_customizations_path: '{project-root}/_gsane/_config/agents'
output_folder: '{project-root}/_gsane-output'
delegation:
  enabled: true
  enforcement_mode: strict
  delegation_required: true
  agents_can_self_execute: false
  delegation_matrix_path: '{project-root}/_gsane/_config/delegation-matrix.yaml'
  delegation_workflow_path: '{project-root}/_gsane/workflows/delegation/workflow.md'
  audit_log_path: '{output_folder}/delegation-audit.md'
violations:
  enabled: true
  log_path: '{output_folder}/violations.log'
  auto_escalate_on_violation: true
  max_violations_before_lockdown: 0
system:
  require_valid_workflow: true
  require_activation_sequence: true
  trace_all_delegations: true
automation:
  severity:
    low:
      description: Missing CHANGELOG entry, manifest row out of sync, outdated comment
        or description
      action: "auto-apply silently — no user prompt required"
    medium:
      description: Deprecated path in workflow, agent description mismatch, stale
        memory file, minor rule drift
      action: auto-apply + single log line in status output
    high:
      description: Rule violation (commit to main, delegation bypass), breaking schema
        change, data loss risk
      action: "notify user only — do NOT auto-apply under any circumstances"
flywheel:
  enabled: true
  trigger_every_n_sessions: 5
  max_auto_corrections_per_cycle: 5
  report_path: '{project-root}/_gsane/_memory/flywheel-report.md'
  history_path: '{project-root}/_gsane/_memory/flywheel-history.md'
  targets:
  - skills: .github/skills/**
  - prompts: .github/prompts/**
  - workflows: _gsane/**/workflows/**/workflow.md
  - manifests: _gsane/_config/*.yaml
  excluded_patterns:
    - "mutation_score"
    - "benchmark_regression"

context_budget:
  max_tokens_per_session: 8000
  warning_threshold: 0.75
  critical_threshold: 0.90
  skills_budget: 1500
  agents_budget: 2000
  workflows_budget: 1000
  reserve: 3500

context_optimization:
  jit_loading: true
  max_skills_per_session: 2
  recommend_compact_at: 0.60
  new_session_at: 0.80
  use_compressed_memory: true
  one_agent_per_session: true
  baseline_tokens_copilot_instructions: 1988
  note: >
    copilot-instructions.md intentionnellement NON réduit —
    contient PRE-ACTION-GATE et délégation critique pour
    anti-solo-creep. Optimisation via JIT skills uniquement.

mutation_testing:
  enabled: true
  min_score: 0.70
  paths:
    - "src/"
  test_scope: "tests/unit/"
  run_on: "manual"
  last_score: null
  last_run: null
benchmarks:
  enabled: true
  owner: quinn
  regression_threshold: 1.20
  baselines:
    gsane_route_ms: 100
    gsane_fetch_memory_ms: 200
    yaml_parse_ms: 50
    checkpoint_read_ms: 100
    validate_pipeline_s: 30
  last_run: null
